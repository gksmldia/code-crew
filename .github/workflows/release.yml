name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `code-crew ${tag}`,
              body: 'See the assets to download this version and install.',
              draft: true,
              prerelease: false,
              target_commitish: context.sha,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install npm deps
        run: npm ci
      - name: Stub hook binary path (satisfies tauri-build resource check)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          ext=""
          [[ "${{ matrix.platform }}" == "windows-latest" ]] && ext=".exe"
          touch src-tauri/binaries/code-crew-hook${ext}
      - name: Build hook binary (macOS — universal)
        if: matrix.platform == 'macos-latest'
        working-directory: ./src-tauri
        run: |
          cargo build --bin code-crew-hook --release --target aarch64-apple-darwin
          cargo build --bin code-crew-hook --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/code-crew-hook \
            target/aarch64-apple-darwin/release/code-crew-hook \
            target/x86_64-apple-darwin/release/code-crew-hook
          cp target/universal-apple-darwin/release/code-crew-hook binaries/code-crew-hook
      - name: Build hook binary (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo build --bin code-crew-hook --release
          cp target/release/code-crew-hook.exe binaries/code-crew-hook.exe
      - name: Smoke test Windows hook binary
        if: matrix.platform == 'windows-latest'
        working-directory: ./src-tauri
        shell: pwsh
        run: |
          $payload = '{"hook_event_name":"SessionStart","session_id":"ci-smoke","cwd":"C:/"}'
          $payload | & .\binaries\code-crew-hook.exe event
          if ($LASTEXITCODE -ne 0) {
            throw "code-crew-hook.exe smoke test failed with exit code $LASTEXITCODE"
          }
      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # 자체 서명 인증서로 서명한다. ad-hoc 서명은 Designated Requirement가
          # cdhash로 잡혀 빌드마다 값이 바뀌고, 그때마다 사용자의 손쉬운 사용
          # (Accessibility) 권한이 무효가 된다. 인증서로 서명하면 DR이 leaf
          # 인증서 해시로 고정돼 업데이트를 해도 권한이 유지된다.
          keychain="$RUNNER_TEMP/code-crew-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$MACOS_SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin pass:"$MACOS_SIGNING_CERT_PASSWORD" \
            -clcerts -nokeys -legacy -out "$RUNNER_TEMP/cert.pem"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          # 이게 없으면 codesign이 키를 못 꺼내 승인 창을 띄우려다 실패한다.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          # 자체 서명이라 신뢰 앵커가 없다. 신뢰시키지 않으면 codesign이
          # "no identity found"로 인증서를 아예 못 본다.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$keychain"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build]
    steps:
      - name: publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false,
            });
